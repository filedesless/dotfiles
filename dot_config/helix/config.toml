theme = "noctalia"

[editor]
line-number = "relative"
mouse = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.soft-wrap]
enable = true

[editor.file-picker]
hidden = false

[keys.normal]
"C-c" = ["keep_primary_selection", "collapse_selection"]
C-s = ":w"
"space" = { x = ":buffer-close" }

[keys.insert]
"C-[" = ["normal_mode", "collapse_selection"]

[keys.select]
"C-[" = ["normal_mode", "collapse_selection"]
