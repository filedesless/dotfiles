[plugin_settings."felipeartur/ai-usagebar"]
panel_open_near_click = true
panel_placement = "floating"

[plugin_settings."h-jangra/keyviz"]
enabled_by_default = false

[plugin_settings."h-jangra/region-recorder"]
video_source = "portal"

[plugin_settings."lowcache/claude-companion"]
answer_open_near_click = true
ask_open_near_click = true
consent_open_near_click = true
sessions_open_near_click = true

[plugin_settings."yuuto/arch-updater"]
aur_helper = "paru"
auto_check_hours = 1
flatpak_enabled = false

[plugins]
enabled = [
    "yuuto/arch-updater",
    "kenn/keybind-cheatsheet",
    "h-jangra/keyviz",
    "noctalia/bongocat",
    "dotnetrob/cat",
    "noctalia/screen_recorder",
    "nightwatch75/claude-cockpit"
]

[shell]
font_family = "SF Pro"
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.launcher]
    categories = false
    show_app_actions = true

        [shell.launcher.providers.windows]
        global = false

    [shell.panel]
    borders = false
    clipboard_position = "auto"
    control_center_placement = "floating"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_wallpaper = true
    shadow = false
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "/home/filedesless/Pictures/Screenshots"
    remember_last_region = true

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Mauve-Lavender"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "niri", "qt", "scroll" ]
    community_ids = [ "zen-browser" ]

[wallpaper.default]
path = "/home/filedesless/Pictures/waves.png"

[wallpaper.last]
path = "/home/filedesless/Pictures/waves.png"

[wallpaper.monitors.DP-1]
path = "/home/filedesless/Pictures/waves.png"

[wallpaper.monitors.HDMI-A-1]
path = "/home/filedesless/Pictures/waves.png"

[widget.audio_visualizer]
show_when_idle = true

[widget.bar]
type = "felipeartur/ai-usagebar:bar"
vendor = "copilot"
visualization = "gauge"

[widget.battery]
enabled = false

[widget.bluetooth]
show_label = true

[widget.brightness]
enabled = false

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.cat_2]
type = "dotnetrob/cat:cat"

[widget.clipboard]
capsule = true
capsule_border = "primary"
capsule_fill = "surface_variant"
capsule_padding = 16
enabled = false

[widget.control-center]
glyph = "layout-dashboard-filled"

[widget.cpu]
glyph = "cpu-usage"

[widget.disk_fast]
glyph = "archive"
path = "/mnt/Fast"
stat = "disk_used_pct"
type = "sysmon"

[widget.disk_root]
glyph = "slash"
stat = "disk_used_pct"
type = "sysmon"

[widget.gpu]
