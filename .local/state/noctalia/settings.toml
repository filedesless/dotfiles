[widget.keyboard_layout]
capsule = true
capsule_border = "primary"
capsule_fill = "surface_variant"
capsule_padding = 16
capsule_radius = "auto"

[widget.launcher]
enabled = false
glyph = "apps"

[widget.media]
art_size = 96
show_progress = true

    [widget.media.actions]
    scroll_down = "none"
    scroll_up = "none"

[widget.privacy]
hide_inactive = true

[widget.pulse]
type = "lowcache/claude-companion:pulse"

[widget.ram]
