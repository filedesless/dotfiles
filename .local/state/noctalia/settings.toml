[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.screenshot]
glyph = "camera"

[widget.sysmon]
enabled = false

[widget.taskbar]
hide_empty_workspaces = true
inactive_opacity = 0.67000000000000004
item_spacing = 16
only_active_workspace = true
show_window_title = true

[widget.taskbar_top]
group_by_workspace = true
hide_empty_workspaces = true
type = "taskbar"
workspace_label_placement = "inside"

[widget.temp]
enabled = false

[widget.tray]
capsule_border = "primary"
capsule_fill = "surface_variant"
capsule_foreground = "primary"
capsule_padding = 16
capsule_radius = "auto"

[widget.volume]
enabled = false

[widget.wallpaper]
enabled = false

[widget.widget]
